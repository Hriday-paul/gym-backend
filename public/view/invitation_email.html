<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Account Created</title>
</head>
<body style="margin:0; padding:20px; background-color:#ffffff; font-family: Arial, Helvetica, sans-serif; color:#222222;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:500px; margin:0 auto;">
    <tr>
      <td style="padding:10px 0 20px; border-bottom:2px solid #222222;">
        <h2 style="margin:0; font-size:20px;">Jiu Jitsu App</h2>
      </td>
    </tr>

    <tr>
      <td style="padding:24px 0 8px; font-size:15px; line-height:1.6;">
        Hi {{name}},<br><br>
        A staff account has been created for you. Here are your login details:
      </td>
    </tr>

    <tr>
      <td style="padding:16px 0;">
        <p style="margin:0 0 8px; font-size:14px;"><strong>Email:</strong> {{email}}</p>
        <p style="margin:0 0 8px; font-size:14px;"><strong>Password:</strong> {{password}}</p>
        <p style="margin:0; font-size:14px;"><strong>Login Link:</strong> <a href="{{link}}" style="color:#1a73e8;">{{link2}}</a></p>
      </td>
    </tr>

    <tr>
      <td style="padding:16px 0 0; font-size:13px; color:#666666; line-height:1.6;">
        Please log in and change your password as soon as possible.<br>
      </td>
    </tr>

    <tr>
      <td style="padding:24px 0 0; font-size:12px; color:#999999;">
        &copy;Jiu Jitsu App. All rights reserved.
      </td>
    </tr>
  </table>

</body>
</html>
